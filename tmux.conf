# Shared tmux settings for the `team` tool. install.sh adds one line to your own
# tmux config that sources this file, so your personal settings stay yours and
# `git pull` brings in changes. Anything you set after that line wins.
#
# Send copies (mouse selection or copy-mode) out to the terminal's clipboard
# via OSC 52. Default 'external' only forwards apps' clipboard escapes and keeps
# tmux's own copies in the local buffer, so they never reach the OS clipboard.
set -g set-clipboard on

# Let applications pass escape sequences through to the outer terminal — needed
# for iTerm2 tab-color (OSC 6) etc. tmux 3.4 changed this default from on to off.
set -g allow-passthrough on

set -s extended-keys on
set -as terminal-features ',xterm-256color:extkeys'
set -g mouse on


# Cmd+Left / Cmd+Right switch windows. macOS never puts the Command modifier on
# the wire, so iTerm2 has to be told to send something for it (Settings ->
# Profiles -> Keys -> Key Mappings -> Send Escape Sequence, "[9001~"/"[9002~").
# These CSI ... ~ codes are outside the range any real key produces, so nothing
# else can collide with them; plain arrows still reach the pane untouched.
set -s user-keys[0] "\e[9001~"
set -s user-keys[1] "\e[9002~"
bind -n User0 previous-window
bind -n User1 next-window

# Mark the current window by reversing the bar colour instead of tmux's "*".
# These are WINDOW options, so "-wg" makes them the default every window in
# every session inherits - including sessions created later.
# #{s/[-*]//:window_flags} drops "*" (redundant with the highlight) and "-"
# (last window) while keeping Z zoomed, # activity, ! bell, ~ silence, M marked.
setw -g window-status-separator ""
setw -g window-status-format " #I #W#{s/[-*]//:window_flags} "
setw -g window-status-current-format "#[reverse,bold] #I #W#{s/[-*]//:window_flags} #[noreverse,nobold]"
