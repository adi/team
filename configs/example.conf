# example: one window per project, each running a continued claude session.
#   name | directory | command
#
# Copy this to <yourname>.conf and edit. The file name is the config name, so
# example.conf gives you a session called team-example.

api            | ~/work/api            | claude --continue --permission-mode auto
web            | ~/work/web            | claude --continue --permission-mode auto
worker         | ~/work/worker         | claude --continue --dangerously-skip-permissions
notes          | ~/notes               | nvim
